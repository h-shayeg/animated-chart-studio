[project]
name = "chart-studio-api"
version = "0.1.0"
description = "REST API for Animated Chart Studio: data upload, analysis and chart-ready output."
readme = "README.md"
authors = [
    { name = "Hadi", email = "hadishayeg7275@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=chart_studio_api --cov-report=term-missing"

[tool.coverage.run]
branch = true
