name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a file
        2. Open the XRD panel
        3. Press Analyze
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chart studio
        - XRD analysis
        - Data upload and table
        - Backend API
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and system
      placeholder: Chrome on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste anything that helps, such as the browser console or the backend log.
