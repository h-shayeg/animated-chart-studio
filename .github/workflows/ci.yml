name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build both images and start the app
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke test
        run: |
          # The backend on its own port.
          curl -fsS http://localhost:8000/health
          # The page, and the backend reached through the frontend.
          curl -fsS -o page.html http://localhost:8080/
          grep -q '<div id="root">' page.html
          curl -fsS http://localhost:8080/health
          curl -fsS -o parsed.json -F file=@samples/xrd-silicon-synthetic.csv \
            http://localhost:8080/api/v1/datasets/parse
          grep -q '"rows":3000' parsed.json

      - name: Show the logs if something failed
        if: failure()
        run: docker compose logs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
