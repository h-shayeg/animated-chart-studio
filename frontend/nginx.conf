# Serves the built app and passes API calls on to the backend service.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API accepts files up to 10 MB; the form around a file adds a little to that.
    # Anything larger is refused here, with a message in the same shape as the API's own.
    client_max_body_size 12m;
    error_page 413 = @too_large;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The health check and the interactive API docs of the backend.
    location ~ ^/(health|docs|openapi\.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Built files carry a hash in their name, so browsers may keep them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"detail":"The file is too large."}';
    }
}
